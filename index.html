</style></head><body><header><div class="identity"><img class="rip-mark" src="rip-mascot.png" alt="RIP, Iron Log Doberman mascot"><div class="brand" aria-label="IRON LOG"><span class="brand-iron">IRON</span><span class="brand-log">LOG</span><small class="brand-rule">✦ BUILT FOR THE WORK ✦</small></div></div></header><main><div class="top"><div><div class="muted">Training control center</div><h1 id="heading">Dashboard</h1></div><div class="muted" id="date"></div></div><nav class="tabs" aria-label="Navigation"><button data-tab="home" class="active">HOME</button><button data-tab="train">TRAIN</button><button data-tab="builder">BUILDER</button><button data-tab="history">HISTORY</button><button data-tab="progress">PROGRESS</button><button data-tab="anatomy">ANATOMY</button></nav><section id="view"></section><footer>IRON LOG · LOCAL-FIRST PROTOTYPE · V1.5</footer></main><script>
const KEY='ironlog-v1';const defaults={sessions:[],draft:null};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{state=structuredClone(defaults)};let tab='home',mapMode='simple',selectedMuscle='',librarySearch='',chosenExercise='Pull-up';const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,10);$('#date').textContent=new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}).toUpperCase();

const initialTemplates=[{id:'upper-a',name:'Upper A',focus:'Back priority',exercises:originalTemplates['Pull 1']},{id:'lower-a',name:'Lower A',focus:'Quad priority',exercises:originalTemplates.Lower},{id:'upper-b',name:'Upper B',focus:'Chest and shoulders',exercises:originalTemplates.Push},{id:'lower-b',name:'Lower B',focus:'Posterior chain and stability',exercises:['45° Back Extension','Seated Good Morning','Glute Bridge','Copenhagen Plank','Standing Calf Raise','Bird Dog']},{id:'upper-c',name:'Upper C',focus:'Back and arms',exercises:originalTemplates['Pull 2']}];
// Existing users keep their original five templates on first upgrade; new users get 3 upper / 2 lower.
if(!Array.isArray(state.templates)){const existing=!!(state.sessions.length||state.draft);state.templates=existing?Object.entries(originalTemplates).map(([name,exercises],i)=>({id:'legacy-'+i,name,focus:'Edit priority',exercises})):structuredClone(initialTemplates);save()}
const BLOCK_DEFAULT={name:'Hypertrophy — Block 01',weeks:5,startDate:new Date().toISOString().slice(0,10),rir:[3,2,1,1,4,4,4,4],deloadWeek:5,repMin:8,repMax:12,increment:2.5};
if(!state.trainingBlock||typeof state.trainingBlock!=='object'){state.trainingBlock=structuredClone(BLOCK_DEFAULT);save()}
function block(){return state.trainingBlock}
function blockWeek(){const days=Math.floor((new Date().setHours(12,0,0,0)-new Date(block().startDate+'T12:00:00').getTime())/86400000);return Math.max(1,Math.min(Number(block().weeks)||5,Math.floor(days/7)+1))}

function isDeload(w=blockWeek()){return w===Number(block().deloadWeek)}

function updateWeekRir(i,v){block().rir[i]=Number(v);save();render()}
function updateSetType(exId,setId,v){const s=state.draft?.exercises.find(x=>x.id===exId)?.sets.find(s=>s.id===setId);if(!s)return;s.type=v;if(v==='Failure')s.rir='0';save();render()}
function updateDrop(exId,setId,k,v){const s=state.draft?.exercises.find(x=>x.id===exId)?.sets.find(s=>s.id===setId);if(!s)return;s[k]=v;save()}
function setTargetForDraft(){return state.draft?.blockWeek||blockWeek()}
function loggedWorkingSets(x){return x.sets.filter(s=>s.reps!==''&&s.reps!=null&&Number(s.reps)>0&&s.type!=='Warm-up')}
function comparableHistory(name){return [...state.sessions].filter(s=>s.exercises.some(x=>x.name===name)).sort((a,b)=>new Date(a.date)-new Date(b.date)).map(s=>{const x=s.exercises.find(x=>x.name===name);const sets=loggedWorkingSets(x).filter(z=>Number(z.weight)>0&&z.type!=='Drop set'&&z.type!=='Rest-pause');if(!sets.length)return null;const top=Math.max(...sets.map(z=>Number(z.weight)*(1+Number(z.reps)/30)));return{date:s.date,top,sets:sets.length}}).filter(Boolean)}
function intelligenceTips(){const names=[...new Set(state.sessions.flatMap(s=>s.exercises.map(x=>x.name)))];const tips=[];let declines=0;for(const name of names){const h=comparableHistory(name);if(h.length<3)continue;const a=h.slice(-3);if(a[0].top>a[1].top*1.03&&a[1].top>a[2].top*1.03){declines++;tips.push({title:name+' — performance trend',body:'Estimated performance has declined in three consecutive comparable sessions. Check recovery, technique, RIR, and exercise setup before changing the program.'})}}if(declines>=2)tips.unshift({title:'Deload review suggested',body:'Multiple exercises show repeated declines. Consider reducing working sets and/or load for several sessions. This is a prompt for review, not an automatic prescription.'});if(!tips.length)tips.push({title:'Keep collecting training data',body:'After at least three comparable weighted sessions per exercise, Iron Log can flag repeated performance drops. One bad session is not enough to suggest a deload.'});return tips.slice(0,5)}
function progressionForExercise(x){const prior=comparableHistory(x.name);if(!prior.length)return 'First comparable session: establish a baseline at the prescribed RIR.';const sets=loggedWorkingSets(x).filter(s=>s.type!=='Drop set'&&s.type!=='Rest-pause');if(!sets.length)return 'Log working sets to see a progression suggestion.';const b=block();const repMin=Number(b.repMin)||8,repMax=Number(b.repMax)||12,goal=targetRir(setTargetForDraft());const allTop=sets.every(s=>Number(s.reps)>=repMax&&s.rir!==''&&Number(s.rir)>=goal);const anyLow=sets.some(s=>Number(s.reps)<repMin);if(allTop)return 'Consider adding '+b.increment+' lb next session if technique and recovery remain solid.';if(anyLow)return 'Below target rep range on a working set: consider holding or reducing load, or reviewing recovery.';return 'Keep the load and work toward '+repMax+' reps at about '+goal+' RIR.'}
function intelligence(){const b=block(),week=blockWeek();return `<div class="panel"><div class="row"><div><div class="label">IRON INTELLIGENCE</div><h2 class="intel-heading">${esc(b.name)}</h2></div><span class="pill">WEEK ${week} / ${b.weeks}</span></div><div class="intel-week-grid">${Array.from({length:b.weeks},(_,i)=>`<div class="intel-week ${i+1===week?'current':''}">W${i+1}<small>${i+1===Number(b.deloadWeek)?'DELOAD':(b.rir[i]??2)+' RIR'}</small></div>`).join('')}</div><p class="intel-note">Current target: ${isDeload()?'Deload week — consider fewer hard sets and/or lighter loads.':targetRir()+' RIR on standard working sets.'} Weeks advance from the block start date, not from completed workouts.</p></div><div class="panel intel-settings"><h2 class="intel-heading">Configure training block</h2><label>Block name</label><input value="${esc(b.name)}" onchange="updateBlock('name',this.value)"><div class="intel-row"><div><label>Start date</label><input type="date" value="${esc(b.startDate)}" onchange="updateBlock('startDate',this.value)"></div><div><label>Length</label><select onchange="updateBlock('weeks',this.value)">${[4,5,6,7,8].map(n=>`<option value="${n}" ${n===Number(b.weeks)?'selected':''}>${n} weeks</option>`).join('')}</select></div></div><label>Deload week</label><select onchange="updateBlock('deloadWeek',this.value)">${Array.from({length:b.weeks},(_,i)=>`<option value="${i+1}" ${i+1===Number(b.deloadWeek)?'selected':''}>Week ${i+1}</option>`).join('')}<option value="0" ${Number(b.deloadWeek)===0?'selected':''}>No scheduled deload</option></select><div class="intel-row"><div><label>Rep range minimum</label><input type="number" min="1" max="30" value="${b.repMin}" onchange="updateBlock('repMin',this.value)"></div><div><label>Rep range maximum</label><input type="number" min="1" max="50" value="${b.repMax}" onchange="updateBlock('repMax',this.value)"></div></div><label>Suggested load increase (lb)</label><input type="number" min="0.5" step="0.5" value="${b.increment}" onchange="updateBlock('increment',this.value)"><h2 class="intel-heading">Weekly RIR targets</h2><div class="intel-week-grid">${Array.from({length:b.weeks},(_,i)=>`<div><label>W${i+1}</label><select aria-label="Week ${i+1} RIR" onchange="updateWeekRir(${i},this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${n===Number(b.rir[i]??2)?'selected':''}>${n}</option>`).join('')}</select></div>`).join('')}</div><p class="intel-note">RIR targets are guidelines, not required performance. Deloads are suggestions and can be postponed or skipped.</p></div><div class="panel"><h2 class="intel-heading">Performance review</h2>${intelligenceTips().map(t=>`<div class="intel-tip"><strong>${esc(t.title)}</strong>${esc(t.body)}</div>`).join('')}<p class="intel-note">Comparisons use a rough estimated-strength metric from logged load and reps; changes in RIR, technique, equipment or fatigue can affect the result. Never an automatic diagnosis.</p></div>`}
let editDay=0,picker=null,pickerSearch='',pickerMuscle='All',pickerEquipment='All';
const dayAt=i=>state.templates[i];const q=s=>JSON.stringify(String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function setDayField(i,key,v){dayAt(i)[key]=v;save()}
function moveDay(i,delta){const j=i+delta;if(j<0||j>=state.templates.length)return;[state.templates[i],state.templates[j]]=[state.templates[j],state.templates[i]];editDay=j;save();render()}
function moveTemplateEx(i,delta){const ex=dayAt(editDay).exercises,j=i+delta;if(j<0||j>=ex.length)return;[ex[i],ex[j]]=[ex[j],ex[i]];save();render()}
function deleteTemplateEx(i){if(!confirm('Remove this exercise from the template?'))return;dayAt(editDay).exercises.splice(i,1);save();render()}
function moveToDay(i,j){if(j===editDay)return;const name=dayAt(editDay).exercises.splice(i,1)[0];dayAt(j).exercises.push(name);save();render()}

function openPicker(mode,index){picker={mode,index};pickerSearch='';pickerMuscle='All';pickerEquipment='All';variantBase=null;render();setTimeout(()=>$('#picker-search')?.focus(),0)}

function filterPicker(k,v){if(k==='search')pickerSearch=v;if(k==='muscle')pickerMuscle=v;if(k==='equipment')pickerEquipment=v;render();if(k==='search'){const e=$('#picker-search');e?.focus();e?.setSelectionRange(v.length,v.length)}}
let variantBase=null,variantGrip='Standard',variantWidth='Standard',variantSide='Bilateral';
function variantConfig(name){const item=library.find(x=>x[0]===name);const lower=name.toLowerCase();const leg=!!item&&/Quadriceps|Hamstrings|Gluteus|Hip adductors|Gastrocnemius|Soleus|Tibialis/.test(item[1]);const core=!!item&&/ab wheel|plank|bird dog|crunch|dead bug|pallof|hanging/.test(lower);const grip=!leg&&!core&&/pull|row|curl|press|pushdown|extension|chin|shrug|fly|raise/.test(lower);const width=grip&&/pull|row|press|push-up|chin/.test(lower);const unilateral=leg?!/squat$|good morning|nordic|copenhagen/.test(lower):!core&&item?.[3]!=='Barbell'&&/pull|row|curl|press|fly|raise|pushdown|extension|shrug/.test(lower);return {grip,width,unilateral,leg}}
function selectVariant(name){variantBase=name;variantGrip='Standard';variantWidth='Standard';variantSide='Bilateral';render();document.getElementById('variant-editor')?.scrollIntoView({block:'nearest'})}
function changeVariant(field,value){if(field==='grip')variantGrip=value;if(field==='width')variantWidth=value;if(field==='side')variantSide=value;render()}
function confirmVariant(){if(!variantBase)return;const c=variantConfig(variantBase);let name=variantBase;if(c.unilateral&&variantSide!=='Bilateral'&&!/single.arm|single.leg/i.test(name))name=(variantSide==='Alternating'?'Alternating ':c.leg?'Single-leg ':'Single-arm ')+name;if(c.width&&variantWidth!=='Standard'&&!new RegExp('\\b'+variantWidth+'[- ]grip','i').test(name))name=variantWidth+'-grip '+name;if(c.grip&&variantGrip!=='Standard'&&!new RegExp('\\b'+variantGrip+'[- ]grip','i').test(name))name=variantGrip+'-grip '+name;variantBase=null;applyPicker(name)}
function variantEditor(){if(!variantBase)return '';const c=variantConfig(variantBase);const field=(label,key,value,options)=>`<div><label>${label}</label><select onchange="changeVariant('${key}',this.value)">${options.map(o=>`<option value="${o}" ${value===o?'selected':''}>${o}</option>`).join('')}</select></div>`;return `<div id="variant-editor" class="variant-editor"><h2>Configure variation</h2><strong>${esc(variantBase)}</strong><p class="note">Only applicable options are shown. Variations are logged separately by exercise name.</p><div class="two">${c.grip?field('Grip orientation','grip',variantGrip,['Standard','Pronated','Supinated','Neutral']):''}${c.width?field('Grip width','width',variantWidth,['Standard','Narrow','Wide']):''}${c.unilateral?field(c.leg?'Leg configuration':'Arm configuration','side',variantSide,['Bilateral','Single','Alternating']):''}</div><button class="btn" style="margin-top:12px;width:100%" onclick="confirmVariant()">USE THIS EXERCISE →</button></div>`}
function applyPicker(name){if(!picker)return;if(picker.mode==='session-add'){state.draft.exercises.push(newEx(name))}else if(picker.mode==='session'){const x=state.draft.exercises.find(x=>x.id===picker.index);if(x)x.name=name}else if(picker.mode==='replace'){dayAt(editDay).exercises[picker.index]=name}else dayAt(editDay).exercises.push(name);save();picker=null;render()}
function resetSplit(){if(!confirm('Replace your editable templates with the suggested 3-upper / 2-lower split? Your workout history stays intact.'))return;state.templates=structuredClone(initialTemplates);editDay=0;save();render()}
function templateByName(name){return state.templates.find(t=>t.id===name||t.name===name)}

function newEx(name){return{id:uid(),name,group:'',sets:[{id:uid(),weight:'',reps:'',rir:'',type:'Straight'},{id:uid(),weight:'',reps:'',rir:'',type:'Straight'}]}}function start(name){if(state.draft&&!confirm('Replace the current unfinished workout?'))return;state.draft={id:uid(),name,date:new Date().toISOString(),blockWeek:blockWeek(),exercises:(templateByName(name)?.exercises||[]).map(newEx)};save();tab='train';render()}function updateName(v){state.draft.name=v;save()}function replaceSessionEx(id){openPicker('session',id)}function addEx(){openPicker('session-add',-1)}function addSet(id){state.draft.exercises.find(x=>x.id===id).sets.push({id:uid(),weight:'',reps:'',rir:'',type:'Straight'});save();render()}function delSet(id,sid){const x=state.draft.exercises.find(x=>x.id===id);x.sets=x.sets.filter(s=>s.id!==sid);save();render()}function updateSet(id,sid,k,v){const s=state.draft.exercises.find(x=>x.id===id).sets.find(s=>s.id===sid);s[k]=v;save()}function updateGroup(id,v){state.draft.exercises.find(x=>x.id===id).group=v;save()}function removeEx(id){if(confirm('Remove exercise?')){state.draft.exercises=state.draft.exercises.filter(x=>x.id!==id);save();render()}}function finish(){if(!state.draft)return;if(!confirm('Finish and save this workout?'))return;state.draft.completed=new Date().toISOString();state.sessions.unshift(state.draft);state.draft=null;save();tab='history';render()}function cancel(){if(confirm('Discard current workout?')){state.draft=null;save();render()}}function fmt(d){return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function volume(s){return s.exercises.reduce((a,x)=>a+x.sets.reduce((b,z)=>b+(Number(z.weight)||0)*(Number(z.reps)||0),0),0)}
function home(){const total=state.sessions.length,sets=state.sessions.reduce((a,s)=>a+s.exercises.reduce((b,x)=>b+x.sets.filter(z=>z.reps).length,0),0);return `<div class="panel"><div class="muted">Ready to work?</div><h2 style="font-size:25px;margin:10px 0">NO EXCUSES. JUST REPS.</h2><p class="note">Start a session, track every working set, and build a history you can actually use.</p><button class="btn" onclick="start('Custom workout')">+ Start workout</button>${state.draft?` <button class="btn secondary" onclick="tab='train';render()">Resume session</button>`:''}</div><div class="grid"><div class="panel"><div class="label">Sessions</div><div class="big">${total}</div></div><div class="panel"><div class="label">Logged sets</div><div class="big">${sets}</div></div><div class="panel"><div class="label">Last trained</div><div class="big" style="font-size:14px">${total?fmt(state.sessions[0].date):'—'}</div></div></div><h2>Training templates</h2><div class="stack">${state.templates.map(t=>`<div class="panel row"><div><strong>${esc(t.name)}</strong><div class="note">${esc(t.focus)} · ${t.exercises.length} exercises</div></div><button class="btn small" onclick="start(${q(t.id)})">START →</button></div>`).join('')}</div>`}
function train(){if(!state.draft)return `<div class="empty">No active workout.<p>Choose a template or start from scratch.</p><button class="btn" onclick="start('Custom workout')">Start empty workout</button></div><h2 style="margin-top:25px">Templates</h2>${state.templates.map(t=>`<button class="btn secondary small" style="margin:4px" onclick="start(${q(t.id)})">${esc(t.name)}</button>`).join('')}`;const d=state.draft;return `<div class="panel"><label>Session name</label><input aria-label="Session name" value="${esc(d.name)}" onchange="updateName(this.value)"><p class="note">Started ${new Date(d.date).toLocaleString()} · Block week ${setTargetForDraft()} · ${isDeload(setTargetForDraft())?'Deload':'Target '+targetRir(setTargetForDraft())+' RIR'}</p></div>${picker?.mode?.startsWith('session')?pickerView():''}${d.exercises.map(x=>`<div class="panel exercise"><div class="row"><h2 style="margin:0">${esc(x.name)}</h2><div class="row"><button class="btn secondary small" onclick="replaceSessionEx('${x.id}')">REPLACE</button><button class="btn ghost small" onclick="removeEx('${x.id}')">REMOVE</button></div></div><div style="margin:12px 0"><label>Superset group (optional, e.g. A1)</label><input placeholder="A1 / A2" value="${esc(x.group)}" onchange="updateGroup('${x.id}',this.value)"></div><div class="set"><div class="label">SET</div><div class="label">LB</div><div class="label">REPS</div><div class="label">RIR</div><div></div></div>${x.sets.map((s,i)=>`<div class="set"><div class="num">${i+1}</div>${['weight','reps','rir'].map(k=>`<input type="number" inputmode="decimal" min="0" aria-label="${k}" value="${esc(s[k])}" oninput="updateSet('${x.id}','${s.id}','${k}',this.value)">`).join('')}<button class="delete" aria-label="Delete set" onclick="delSet('${x.id}','${s.id}')">×</button></div>`+`<div class="intel-set-meta"><div><label>Set type</label><select aria-label="Set type" onchange="updateSetType('${x.id}','${s.id}',this.value)">${['Straight','Warm-up','Failure','Drop set','Rest-pause'].map(t=>`<option ${((s.type||'Straight')===t)?'selected':''}>${t}</option>`).join('')}</select></div>${s.type==='Drop set'?`<div><label>Drop weight / reps</label><div class="row"><input type="number" placeholder="lb" value="${esc(s.dropWeight||'')}" oninput="updateDrop('${x.id}','${s.id}','dropWeight',this.value)"><input type="number" placeholder="reps" value="${esc(s.dropReps||'')}" oninput="updateDrop('${x.id}','${s.id}','dropReps',this.value)"></div></div>`:'<div></div>'}</div>`).join('')}<p class="intel-note">${esc(progressionForExercise(x))}</p><button class="btn secondary small" onclick="addSet('${x.id}')">+ ADD SET</button></div>`).join('')}<div class="panel stack"><button class="btn secondary" onclick="addEx()">+ Add exercise</button><button class="btn" onclick="finish()">Finish & save workout</button><button class="btn ghost" onclick="cancel()">Discard workout</button></div>`}
function pickerView(){const items=library.filter(x=>(x[0].toLowerCase().includes(pickerSearch.toLowerCase())||x[1].toLowerCase().includes(pickerSearch.toLowerCase()))&&(pickerMuscle==='All'||x[1]===pickerMuscle||x[2]===pickerMuscle)&&(pickerEquipment==='All'||x[3]===pickerEquipment));return `<div class="panel picker"><div class="row"><h2>Choose exercise</h2><button class="btn ghost small" onclick="closePicker()">CLOSE</button></div><label>Search</label><input id="picker-search" placeholder="Name or muscle" value="${esc(pickerSearch)}" oninput="filterPicker('search',this.value)"><div class="two"><div><label>Muscle</label><select onchange="filterPicker('muscle',this.value)"><option>All</option>${[...new Set(library.flatMap(x=>[x[1],x[2]]).filter(Boolean))].sort().map(x=>`<option ${pickerMuscle===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Equipment</label><select onchange="filterPicker('equipment',this.value)"><option>All</option>${[...new Set(library.map(x=>x[3]))].sort().map(x=>`<option ${pickerEquipment===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div>${variantEditor()}<div class="picker-results">${items.map(x=>`<button class="library-item" onclick="selectVariant(${q(x[0])})"><strong>${esc(x[0])}</strong><small>${esc(x[1])} · ${esc(x[3])}</small></button>`).join('')||'<p class="note">No matching exercises.</p>'}</div></div>`}
function builder(){const d=dayAt(editDay);return `<div class="panel"><div class="row"><h2>Training split</h2><button class="btn secondary small" onclick="resetSplit()">3 UPPER / 2 LOWER</button></div><p class="note">Edit your weekly plan without changing completed sessions. Existing users keep their old split until they choose to reset it.</p><div class="day-list">${state.templates.map((t,i)=>`<button class="day-chip ${i===editDay?'chosen':''}" onclick="editDay=${i};picker=null;render()">${esc(t.name)}<small>${esc(t.focus)}</small></button>`).join('')}</div><button class="btn secondary small" onclick="addDay()">+ ADD DAY</button></div><div class="panel"><div class="row"><h2>Day settings</h2><div class="row"><button class="btn secondary small" onclick="moveDay(${editDay},-1)" ${editDay===0?'disabled':''}>↑</button><button class="btn secondary small" onclick="moveDay(${editDay},1)" ${editDay===state.templates.length-1?'disabled':''}>↓</button></div></div><label>Day name</label><input value="${esc(d.name)}" onchange="setDayField(${editDay},'name',this.value);render()"><label style="margin-top:12px">Training priority / muscle focus</label><input value="${esc(d.focus)}" onchange="setDayField(${editDay},'focus',this.value);render()"><button style="margin-top:12px" class="btn ghost small" onclick="removeDay()">DELETE DAY</button></div><h2>Exercise order</h2>${d.exercises.map((name,i)=>`<div class="panel"><div class="row"><div><div class="label">${i+1} · EXERCISE</div><strong>${esc(name)}</strong></div><div class="row"><button class="btn secondary small" aria-label="Move up" onclick="moveTemplateEx(${i},-1)" ${i===0?'disabled':''}>↑</button><button class="btn secondary small" aria-label="Move down" onclick="moveTemplateEx(${i},1)" ${i===d.exercises.length-1?'disabled':''}>↓</button></div></div><div class="actions"><button class="btn secondary small" onclick="openPicker('replace',${i})">REPLACE</button><button class="btn ghost small" onclick="deleteTemplateEx(${i})">REMOVE</ function history(){return state.sessions.length?state.sessions.map(s=>`<div class="panel"><div class="row"><h2 style="margin:0">${esc(s.name)}</h2><span class="muted">${fmt(s.date)}</span></div><p class="note">${s.exercises.length} exercises · ${s.exercises.reduce((a,x)=>a+x.sets.filter(z=>z.reps).length,0)} logged sets · ${Math.round(volume(s)).toLocaleString()} lb volume</p><details><summary>View sets</summary>${s.exercises.map(x=>`<p><strong>${esc(x.name)}</strong> ${x.group?`<span class="pill">${esc(x.group)}</span>`:''}<br><span class="note">${x.sets.map(z=>`${esc(z.weight||'—')} lb × ${esc(z.reps||'—')} reps (RIR ${esc(z.rir??'—')} · ${esc(z.type||'Straight')}${z.type==='Drop set'?' → '+esc(z.dropWeight||'—')+' lb × '+esc(z.dropReps||'—'):''})`).join(' · ')}</span></p>`).join('')}</details></div>`).join(''):`<div class="empty">No saved sessions yet. Finish a workout to see your history.</div>`}
function progress(){const data={};for(const s of [...state.sessions].reverse())for(const x of s.exercises)for(const z of x.sets){const v=Number(z.weight);if(v>0&&Number(z.reps)>0)(data[x.name]??=[]).push({date:s.date,weight:v,reps:Number(z.reps)})}return intelligence()+(Object.keys(data).length?Object.entries(data).map(([n,records])=>{const best=Math.max(...records.map(r=>r.weight));const latest=records[records.length-1];return `<div class="panel"><h2>${esc(n)}</h2><div class="grid"><div><div class="label">Heaviest</div><div class="big">${best} lb</div></div><div><div class="label">Latest</div><div class="big">${latest.weight} lb</div></div><div><div class="label">Sets logged</div><div class="big">${records.length}</div></div></div><p class="note">Last recorded: ${fmt(latest.date)} · ${latest.reps} reps</p></div>`}).join(''):`<div class="empty">Log weighted sets to unlock exercise progress summaries.</div>`)}

function chooseExercise(n){chosenExercise=n;render()}
function searchLibrary(v){librarySearch=v;render();const i=$('#library-search');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}
function anatomy(){const e=library.find(x=>x[0]===chosenExercise)||library[0],primary=e[1],secondary=e[2],results=library.filter(x=>(!selectedMuscle||muscles[selectedMuscle].includes(x[1])||muscles[selectedMuscle].includes(x[2]))&&x[0].toLowerCase().includes(librarySearch.toLowerCase()));return `<div class="panel"><h2>Muscle atlas</h2><p class="note">Tap a muscle region to filter exercises. Select an exercise to highlight its primary (orange) and secondary (bronze) muscle groups. Illustrative involvement, not measured activation.</p><div class="mode"><button class="btn small ${mapMode==='simple'?'selected':'secondary'}" onclick="changeMode('simple')">SIMPLE</button><button class="btn small ${mapMode==='detailed'?'selected':'secondary'}" onclick="changeMode('detailed')">DETAILED</button></div><div class="maps"><div class="map-card"><div class="map-label">FRONT</div>${mapSvg('front',primary,secondary)}</div><div class="map-card"><div class="map-label">BACK</div>${mapSvg('back',primary,secondary)}</div></div><p class="note"><strong>${esc(e[0])}</strong> · Primary: ${esc(primary)} · Secondary: ${esc(secondary||'None assigned')}</p>${mapMode==='detailed'?`<h2>Detailed muscle groups</h2>${Object.entries(muscles).map(([k,arr])=>`<details ${k===selectedMuscle?'open':''}><summary style="padding:9px 0;text-transform:capitalize">${k} (${arr.length})</summary><div class="muscle-list">${arr.map(n=>`<button class="${n===primary?'active':''}" onclick="selectedMuscle='${k}';render()">${esc(n)}</button>`).join('')}</div></details>`).join('')}<p class="note">Detailed mode names individual muscles; map silhouettes currently highlight their parent regions. Individually segmented muscle artwork is a future enhancement.</p>`:''}<button class="btn ghost small" style="margin-top:12px" onclick="selectedMuscle='';render()">Clear muscle filter</button></div><div class="panel"><h2>Exercise library · ${results.length} / ${library.length}</h2><label for="library-search">Search exercises</label><input id="library-search" placeholder="Search by exercise name" value="${esc(librarySearch)}" oninput="searchLibrary(this.value)"><div style="max-height:400px;overflow:auto;margin-top:10px">${results.map(x=>`<button class="library-item" onclick="chooseExercise(${JSON.stringify(x[0]).replace(/"/g,'&quot;')})"><strong>${esc(x[0])}</strong><small>${esc(x[3])} · ${esc(x[1])}${x[2]?' + '+esc(x[2]):''}</small></button>`).join('')||'<p class="note">No matching exercises.</p>'}</div></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#heading').textContent={home:'Dashboard',train:'Workout',builder:'Workout Builder',history:'History',progress:'Progress',anatomy:'Anatomy'}[tab];$('#view').innerHTML={home,train,builder,history,progress,anatomy}[tab]()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
