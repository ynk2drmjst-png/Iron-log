<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101113"><title>IRON LOG</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#f4f1eb;background:#101113}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}header{padding:26px 20px 16px;border-bottom:1px solid #383a3d;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:29px;letter-spacing:-1px}.brand span{color:#fa6a30}.muted{color:#96999e;font-size:12px;letter-spacing:2px;text-transform:uppercase}main{max-width:680px;margin:auto;padding:22px 16px 90px}.top{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}h1{font-size:30px;margin:6px 0 0;text-transform:uppercase;letter-spacing:-1px}h2{font-size:18px;margin:0 0 15px;text-transform:uppercase}.panel{background:#1b1d20;border:1px solid #34373b;border-radius:10px;padding:18px;margin-bottom:14px}.btn{background:#f36a32;border:0;color:#151515;padding:13px 16px;border-radius:7px;font-weight:850;text-transform:uppercase}.btn.secondary{background:#303338;color:#f2f2f2}.btn.ghost{background:transparent;color:#e9e9e9;border:1px solid #4b4d51}.btn.small{padding:9px 11px;font-size:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.stack{display:grid;gap:10px}.label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#a6a7ab}.big{font-size:23px;font-weight:850}.tabs{display:flex;gap:6px;margin-bottom:22px}.tabs button{flex:1;border:1px solid #373a3e;background:#202226;color:#aeb0b4;padding:12px 4px;border-radius:7px;font-weight:800;font-size:12px}.tabs button.active{background:#f36a32;color:#141414;border-color:#f36a32}input,select{min-width:0;width:100%;background:#111214;border:1px solid #42454a;border-radius:6px;padding:11px;color:white}label{display:block;font-size:11px;color:#aeb0b4;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.exercise{border-left:3px solid #f36a32}.set{display:grid;grid-template-columns:35px repeat(3,minmax(0,1fr)) 32px;gap:6px;align-items:end;margin:8px 0}.set input{text-align:center;padding:10px 2px}.set .num{color:#f36a32;font-weight:800;text-align:center;padding-bottom:12px}.delete{border:0;background:#3a2b29;color:#ff987a;border-radius:6px;padding:10px 0}.note{font-size:12px;color:#aaa;line-height:1.5}.pill{display:inline-block;background:#34373a;border-radius:4px;padding:4px 7px;font-size:10px;letter-spacing:1px;color:#e3e3e3;margin-top:5px}.empty{padding:40px 15px;text-align:center;color:#a7a7a7;border:1px dashed #484a4e;border-radius:8px}.tabs{flex-wrap:wrap}.tabs button{min-width:18%}.mode{display:flex;gap:8px;margin:12px 0}.mode button{flex:1}.mode .selected{background:#f36a32;color:#111}.maps{display:grid;grid-template-columns:1fr 1fr;gap:10px}.map-card{background:#121416;border:1px solid #393d41;border-radius:10px;padding:8px;text-align:center}.map-card svg{width:100%;height:auto;max-height:370px}.muscle{fill:#444a50;stroke:#15191c;stroke-width:1.8;cursor:pointer;transition:fill .15s}.muscle.hot{fill:#f36a32}.muscle.secondary-hot{fill:#b97a4b}.muscle:focus{stroke:#fff;stroke-width:3;outline:none}.muscle:hover{fill:#ffa36d}.map-label{font-size:10px;letter-spacing:1px;color:#aaa}.muscle-list{display:flex;flex-wrap:wrap;gap:6px}.muscle-list button{border:1px solid #444;background:#262a2e;color:#eee;padding:8px;border-radius:6px;font-size:12px}.muscle-list button.active{background:#f36a32;color:#111}.library-item{display:block;width:100%;text-align:left;border:1px solid #3b3e42;border-radius:7px;background:#25282b;color:#eee;padding:12px;margin:6px 0}.library-item small{display:block;color:#aaa;margin-top:4px}footer{font-size:11px;color:#76797d;text-align:center;margin-top:30px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #f36a32} @media(min-width:600px){.grid{gap:14px}}
</style></head><body><header><div class="brand">IRON<span>LOG</span></div><div class="muted">Built for the work</div></header><main><div class="top"><div><div class="muted">Training control center</div><h1 id="heading">Dashboard</h1></div><div class="muted" id="date"></div></div><nav class="tabs" aria-label="Navigation"><button data-tab="home" class="active">HOME</button><button data-tab="train">TRAIN</button><button data-tab="history">HISTORY</button><button data-tab="progress">PROGRESS</button><button data-tab="anatomy">ANATOMY</button></nav><section id="view"></section><footer>IRON LOG · LOCAL-FIRST PROTOTYPE · V1.1</footer></main><script>
const KEY='ironlog-v1';const defaults={sessions:[],draft:null};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{state=structuredClone(defaults)};let tab='home',mapMode='simple',selectedMuscle='',librarySearch='',chosenExercise='Pull-up';const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,10);$('#date').textContent=new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}).toUpperCase();
const templates={'Pull 1':['Pull-up','Single-arm Lat Pulldown','Seated Cable Row','Cable Curl','Hammer Curl','Incline Curl','Ab Wheel'],'Lower':['Spanish Squat','45° Back Extension','Split Squat','Seated Good Morning','Standing Calf Raise','Bird Dog'],'Push':['Flat Dumbbell Press','Cable Fly','Triceps Pushdown','Overhead Triceps Extension','Cable Y-Raise'],'Pull 2':['Pull-up','Straight-arm Rope Pulldown','Single-arm Cable Row','Preacher Curl','Reverse Curl','Cable Curl'],'Push 2':['Flat Dumbbell Press','Cable Fly','Rope Triceps Pushdown','Cable Y-Raise','Spanish Squat']};
function newEx(name){return{id:uid(),name,group:'',sets:[{id:uid(),weight:'',reps:'',rir:''},{id:uid(),weight:'',reps:'',rir:''}]}}function start(name){state.draft={id:uid(),name,date:new Date().toISOString(),exercises:(templates[name]||[]).map(newEx)};save();tab='train';render()}function updateName(v){state.draft.name=v;save()}function addEx(){const n=prompt('Exercise name');if(n&&n.trim()){state.draft.exercises.push(newEx(n.trim()));save();render()}}function addSet(id){state.draft.exercises.find(x=>x.id===id).sets.push({id:uid(),weight:'',reps:'',rir:''});save();render()}function delSet(id,sid){const x=state.draft.exercises.find(x=>x.id===id);x.sets=x.sets.filter(s=>s.id!==sid);save();render()}function updateSet(id,sid,k,v){const s=state.draft.exercises.find(x=>x.id===id).sets.find(s=>s.id===sid);s[k]=v;save()}function updateGroup(id,v){state.draft.exercises.find(x=>x.id===id).group=v;save()}function removeEx(id){if(confirm('Remove exercise?')){state.draft.exercises=state.draft.exercises.filter(x=>x.id!==id);save();render()}}function finish(){if(!state.draft)return;if(!confirm('Finish and save this workout?'))return;state.draft.completed=new Date().toISOString();state.sessions.unshift(state.draft);state.draft=null;save();tab='history';render()}function cancel(){if(confirm('Discard current workout?')){state.draft=null;save();render()}}function fmt(d){return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}function volume(s){return s.exercises.reduce((a,x)=>a+x.sets.reduce((b,z)=>b+(Number(z.weight)||0)*(Number(z.reps)||0),0),0)}
function home(){const total=state.sessions.length,sets=state.sessions.reduce((a,s)=>a+s.exercises.reduce((b,x)=>b+x.sets.filter(z=>z.reps).length,0),0);return `<div class="panel"><div class="muted">Ready to work?</div><h2 style="font-size:25px;margin:10px 0">NO EXCUSES. JUST REPS.</h2><p class="note">Start a session, track every working set, and build a history you can actually use.</p><button class="btn" onclick="start('Custom workout')">+ Start workout</button>${state.draft?` <button class="btn secondary" onclick="tab='train';render()">Resume session</button>`:''}</div><div class="grid"><div class="panel"><div class="label">Sessions</div><div class="big">${total}</div></div><div class="panel"><div class="label">Logged sets</div><div class="big">${sets}</div></div><div class="panel"><div class="label">Last trained</div><div class="big" style="font-size:14px">${total?fmt(state.sessions[0].date):'—'}</div></div></div><h2>Training templates</h2><div class="stack">${Object.keys(templates).map(n=>`<div class="panel row"><div><strong>${esc(n)}</strong><div class="note">${templates[n].length} exercises</div></div><button class="btn small" onclick="start('${n}')">START →</button></div>`).join('')}</div>`}
function train(){if(!state.draft)return `<div class="empty">No active workout.<p>Choose a template or start from scratch.</p><button class="btn" onclick="start('Custom workout')">Start empty workout</button></div><h2 style="margin-top:25px">Templates</h2>${Object.keys(templates).map(n=>`<button class="btn secondary small" style="margin:4px" onclick="start('${n}')">${n}</button>`).join('')}`;const d=state.draft;return `<div class="panel"><label>Session name</label><input aria-label="Session name" value="${esc(d.name)}" onchange="updateName(this.value)"><p class="note">Started ${new Date(d.date).toLocaleString()}</p></div>${d.exercises.map(x=>`<div class="panel exercise"><div class="row"><h2 style="margin:0">${esc(x.name)}</h2><button class="btn ghost small" onclick="removeEx('${x.id}')">REMOVE</button></div><div style="margin:12px 0"><label>Superset group (optional, e.g. A1)</label><input placeholder="A1 / A2" value="${esc(x.group)}" onchange="updateGroup('${x.id}',this.value)"></div><div class="set"><div class="label">SET</div><div class="label">LB</div><div class="label">REPS</div><div class="label">RIR</div><div></div></div>${x.sets.map((s,i)=>`<div class="set"><div class="num">${i+1}</div>${['weight','reps','rir'].map(k=>`<input type="number" inputmode="decimal" min="0" aria-label="${k}" value="${esc(s[k])}" oninput="updateSet('${x.id}','${s.id}','${k}',this.value)">`).join('')}<button class="delete" aria-label="Delete set" onclick="delSet('${x.id}','${s.id}')">×</button></div>`).join('')}<button class="btn secondary small" onclick="addSet('${x.id}')">+ ADD SET</button></div>`).join('')}<div class="panel stack"><button class="btn secondary" onclick="addEx()">+ Add exercise</button><button class="btn" onclick="finish()">Finish & save workout</button><button class="btn ghost" onclick="cancel()">Discard workout</button></div>`}
function history(){return state.sessions.length?state.sessions.map(s=>`<div class="panel"><div class="row"><h2 style="margin:0">${esc(s.name)}</h2><span class="muted">${fmt(s.date)}</span></div><p class="note">${s.exercises.length} exercises · ${s.exercises.reduce((a,x)=>a+x.sets.filter(z=>z.reps).length,0)} logged sets · ${Math.round(volume(s)).toLocaleString()} lb volume</p><details><summary>View sets</summary>${s.exercises.map(x=>`<p><strong>${esc(x.name)}</strong> ${x.group?`<span class="pill">${esc(x.group)}</span>`:''}<br><span class="note">${x.sets.map(z=>`${esc(z.weight||'—')} lb × ${esc(z.reps||'—')} reps (RIR ${esc(z.rir||'—')})`).join(' · ')}</span></p>`).join('')}</details></div>`).join(''):`<div class="empty">No saved sessions yet. Finish a workout to see your history.</div>`}
function progress(){const data={};for(const s of [...state.sessions].reverse())for(const x of s.exercises)for(const z of x.sets){const v=Number(z.weight);if(v>0&&Number(z.reps)>0)(data[x.name]??=[]).push({date:s.date,weight:v,reps:Number(z.reps)})}return Object.keys(data).length?Object.entries(data).map(([n,records])=>{const best=Math.max(...records.map(r=>r.weight));const latest=records[records.length-1];return `<div class="panel"><h2>${esc(n)}</h2><div class="grid"><div><div class="label">Heaviest</div><div class="big">${best} lb</div></div><div><div class="label">Latest</div><div class="big">${latest.weight} lb</div></div><div><div class="label">Sets logged</div><div class="big">${records.length}</div></div></div><p class="note">Last recorded: ${fmt(latest.date)} · ${latest.reps} reps</p></div>`}).join(''):`<div class="empty">Log weighted sets to unlock exercise progress summaries.</div>`}

const muscles={chest:['Pectoralis major','Pectoralis minor'],shoulders:['Anterior deltoid','Lateral deltoid','Posterior deltoid'],back:['Latissimus dorsi','Trapezius upper','Trapezius middle','Trapezius lower','Rhomboids','Teres major'],arms:['Biceps brachii','Brachialis','Brachioradialis','Triceps brachii','Forearm flexors','Forearm extensors'],core:['Rectus abdominis','External obliques','Internal obliques','Transverse abdominis','Erector spinae'],hips:['Gluteus maximus','Gluteus medius','Hip adductors','Hip flexors'],legs:['Quadriceps','Hamstrings','Gastrocnemius','Soleus','Tibialis anterior']};
const library=[
['Pull-up','Latissimus dorsi','Biceps brachii','Bodyweight'],['Chin-up','Latissimus dorsi','Biceps brachii','Bodyweight'],['Neutral-grip Pull-up','Latissimus dorsi','Brachialis','Bodyweight'],['Lat Pulldown','Latissimus dorsi','Biceps brachii','Cable'],['Single-arm Lat Pulldown','Latissimus dorsi','Biceps brachii','Cable'],['Straight-arm Rope Pulldown','Latissimus dorsi','Teres major','Cable'],['Seated Cable Row','Latissimus dorsi','Rhomboids','Cable'],['Single-arm Cable Row','Latissimus dorsi','Rhomboids','Cable'],['Barbell Row','Latissimus dorsi','Erector spinae','Barbell'],['Chest-supported Row','Rhomboids','Latissimus dorsi','Dumbbell'],['Face Pull','Posterior deltoid','Trapezius middle','Cable'],['Cable Y-Raise','Trapezius lower','Posterior deltoid','Cable'],['Shrug','Trapezius upper','Forearm flexors','Dumbbell'],['Flat Dumbbell Press','Pectoralis major','Triceps brachii','Dumbbell'],['Bench Press','Pectoralis major','Triceps brachii','Barbell'],['Incline Dumbbell Press','Pectoralis major','Anterior deltoid','Dumbbell'],['Push-up','Pectoralis major','Triceps brachii','Bodyweight'],['Cable Fly','Pectoralis major','Anterior deltoid','Cable'],['Overhead Press','Anterior deltoid','Triceps brachii','Dumbbell'],['Lateral Raise','Lateral deltoid','Trapezius upper','Dumbbell'],['Rear Delt Fly','Posterior deltoid','Rhomboids','Dumbbell'],['Cable Curl','Biceps brachii','Brachialis','Cable'],['Hammer Curl','Brachialis','Brachioradialis','Dumbbell'],['Incline Curl','Biceps brachii','Brachialis','Dumbbell'],['Preacher Curl','Biceps brachii','Brachialis','Dumbbell'],['Reverse Curl','Brachioradialis','Brachialis','Barbell'],['Triceps Pushdown','Triceps brachii','Forearm flexors','Cable'],['Rope Triceps Pushdown','Triceps brachii','Forearm flexors','Cable'],['Overhead Triceps Extension','Triceps brachii','Forearm flexors','Cable'],['Squat','Quadriceps','Gluteus maximus','Barbell'],['Goblet Squat','Quadriceps','Gluteus maximus','Dumbbell'],['Spanish Squat','Quadriceps','Gluteus maximus','Bodyweight'],['Split Squat','Quadriceps','Gluteus maximus','Dumbbell'],['Bulgarian Split Squat','Quadriceps','Gluteus maximus','Dumbbell'],['Lunge','Quadriceps','Gluteus maximus','Dumbbell'],['Step-up','Quadriceps','Gluteus maximus','Dumbbell'],['Romanian Deadlift','Hamstrings','Gluteus maximus','Barbell'],['45° Back Extension','Erector spinae','Gluteus maximus','Bodyweight'],['Seated Good Morning','Erector spinae','Hamstrings','Barbell'],['Hip Thrust','Gluteus maximus','Hamstrings','Barbell'],['Glute Bridge','Gluteus maximus','Hamstrings','Bodyweight'],['Leg Curl','Hamstrings','Gastrocnemius','Machine'],['Leg Extension','Quadriceps','','Machine'],['Copenhagen Plank','Hip adductors','External obliques','Bodyweight'],['Standing Calf Raise','Gastrocnemius','Soleus','Bodyweight'],['Seated Calf Raise','Soleus','Gastrocnemius','Machine'],['Tibialis Raise','Tibialis anterior','','Bodyweight'],['Ab Wheel','Rectus abdominis','Transverse abdominis','Bodyweight'],['Bird Dog','Erector spinae','Transverse abdominis','Bodyweight'],['Plank','Transverse abdominis','Rectus abdominis','Bodyweight'],['Cable Crunch','Rectus abdominis','External obliques','Cable'],['Pallof Press','External obliques','Transverse abdominis','Cable']];
const region={chest:'chest',shoulders:'shoulders',back:'back',arms:'arms',core:'core',hips:'hips',legs:'legs'};
const shapes={front:[['shoulders','M51 44 Q33 44 25 67 L40 88 L55 67 Z M109 44 Q127 44 135 67 L120 88 L105 67 Z'],['chest','M56 46 L80 52 L80 92 L48 88 L44 66 Z M104 46 L80 52 L80 92 L112 88 L116 66 Z'],['arms','M25 69 L39 88 L28 139 L15 132 Z M135 69 L121 88 L132 139 L145 132 Z M14 135 L28 141 L21 180 L7 174 Z M146 135 L132 141 L139 180 L153 174 Z'],['core','M49 94 L111 94 L105 148 L55 148 Z'],['hips','M55 150 L105 150 L116 178 L88 183 L80 170 L72 183 L44 178 Z'],['legs','M44 180 L73 185 L73 250 L60 269 L38 254 Z M87 185 L116 180 L122 254 L100 269 L87 250 Z M39 259 L61 273 L56 337 L35 337 Z M121 259 L99 273 L104 337 L125 337 Z']],back:[['shoulders','M51 44 Q33 44 25 67 L40 88 L55 67 Z M109 44 Q127 44 135 67 L120 88 L105 67 Z'],['back','M55 48 L80 62 L105 48 L115 91 L100 145 L80 153 L60 145 L45 91 Z'],['arms','M25 69 L39 88 L28 139 L15 132 Z M135 69 L121 88 L132 139 L145 132 Z M14 135 L28 141 L21 180 L7 174 Z M146 135 L132 141 L139 180 L153 174 Z'],['core','M63 143 L97 143 L103 159 L57 159 Z'],['hips','M55 161 L80 168 L105 161 L116 180 L88 188 L80 174 L72 188 L44 180 Z'],['legs','M44 183 L73 190 L73 250 L60 269 L38 254 Z M87 190 L116 183 L122 254 L100 269 L87 250 Z M39 259 L61 273 L56 337 L35 337 Z M121 259 L99 273 L104 337 L125 337 Z']]};
function mapSvg(side,primary,secondary){return `<svg viewBox="0 0 160 355" role="img" aria-label="${side} interactive muscle map"><path d="M70 13 Q80 2 90 13 L93 35 L103 42 L80 57 L57 42 L67 35 Z" fill="#4b5055" stroke="#15191c" stroke-width="2"/>${shapes[side].map(([key,d])=>`<path class="muscle ${muscles[key].includes(primary)?'hot':muscles[key].includes(secondary)?'secondary-hot':''}" tabindex="0" role="button" aria-label="${key}" onclick="pickMuscle('${key}')" onkeydown="if(event.key==='Enter')pickMuscle('${key}')" d="${d}"/>`).join('')}</svg>`}
function pickMuscle(k){selectedMuscle=k;render()}
function changeMode(m){mapMode=m;render()}
function chooseExercise(n){chosenExercise=n;render()}
function searchLibrary(v){librarySearch=v;render();const i=$('#library-search');if(i){i.focus();i.setSelectionRange(v.length,v.length)}}
function anatomy(){const e=library.find(x=>x[0]===chosenExercise)||library[0],primary=e[1],secondary=e[2],results=library.filter(x=>(!selectedMuscle||muscles[selectedMuscle].includes(x[1])||muscles[selectedMuscle].includes(x[2]))&&x[0].toLowerCase().includes(librarySearch.toLowerCase()));return `<div class="panel"><h2>Muscle atlas</h2><p class="note">Tap a muscle region to filter exercises. Select an exercise to highlight its primary (orange) and secondary (bronze) muscle groups. Illustrative involvement, not measured activation.</p><div class="mode"><button class="btn small ${mapMode==='simple'?'selected':'secondary'}" onclick="changeMode('simple')">SIMPLE</button><button class="btn small ${mapMode==='detailed'?'selected':'secondary'}" onclick="changeMode('detailed')">DETAILED</button></div><div class="maps"><div class="map-card"><div class="map-label">FRONT</div>${mapSvg('front',primary,secondary)}</div><div class="map-card"><div class="map-label">BACK</div>${mapSvg('back',primary,secondary)}</div></div><p class="note"><strong>${esc(e[0])}</strong> · Primary: ${esc(primary)} · Secondary: ${esc(secondary||'None assigned')}</p>${mapMode==='detailed'?`<h2>Detailed muscle groups</h2>${Object.entries(muscles).map(([k,arr])=>`<details ${k===selectedMuscle?'open':''}><summary style="padding:9px 0;text-transform:capitalize">${k} (${arr.length})</summary><div class="muscle-list">${arr.map(n=>`<button class="${n===primary?'active':''}" onclick="selectedMuscle='${k}';render()">${esc(n)}</button>`).join('')}</div></details>`).join('')}<p class="note">Detailed mode names individual muscles; map silhouettes currently highlight their parent regions. Individually segmented muscle artwork is a future enhancement.</p>`:''}<button class="btn ghost small" style="margin-top:12px" onclick="selectedMuscle='';render()">Clear muscle filter</button></div><div class="panel"><h2>Exercise library · ${results.length} / ${library.length}</h2><label for="library-search">Search exercises</label><input id="library-search" placeholder="Search by exercise name" value="${esc(librarySearch)}" oninput="searchLibrary(this.value)"><div style="max-height:400px;overflow:auto;margin-top:10px">${results.map(x=>`<button class="library-item" onclick="chooseExercise(${JSON.stringify(x[0]).replace(/"/g,'&quot;')})"><strong>${esc(x[0])}</strong><small>${esc(x[3])} · ${esc(x[1])}${x[2]?' + '+esc(x[2]):''}</small></button>`).join('')||'<p class="note">No matching exercises.</p>'}</div></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#heading').textContent={home:'Dashboard',train:'Workout',history:'History',progress:'Progress',anatomy:'Anatomy'}[tab];$('#view').innerHTML={home,train,history,progress,anatomy}[tab]()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
